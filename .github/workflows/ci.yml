name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: python3 scripts/check-rpc-contract.py
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - run: pnpm db:types
      - run: git diff --exit-code -- apps/web/src/shared/types/database.ts
      - run: pnpm build
      - name: Check client bundle for service-role secrets
        run: if grep -rE 'SUPABASE_SERVICE_ROLE|service_role' apps/web/dist; then exit 1; fi
      - run: pnpm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
      - name: Stop Supabase
        if: always()
        run: supabase stop

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jokger/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
